[project]
name = "satquery"
version = "0.1.0"
description = "SatQuery AI - agentic vision-language assistant for remote sensing (SIH 2026 PS 26167)"
requires-python = "==3.11.*"
dependencies = [
    "torch>=2.4,<3",
    "torchvision>=0.19",
    "transformers>=4.45",
    "accelerate>=0.34",
    "bitsandbytes>=0.44",
    "rasterio>=1.3",
    "opencv-python>=4.10",
    "pillow>=10.4",
    "numpy>=1.26,<3",
    "scipy>=1.14",
    "scikit-image>=0.24",
    "streamlit>=1.38",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["satquery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
